<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery-page">
    <h1>My Photo Gallery</h1>
    <p class="subtitle">Six favourite places — hover a tile to zoom in.</p>

    <div class="gallery">
      <!-- Each tile is a CSS gradient placeholder with a caption,
           so the page works fully offline with no image files. -->
      <figure class="tile mountain">
        <figcaption>Mountain</figcaption>
      </figure>

      <figure class="tile beach">
        <figcaption>Beach</figcaption>
      </figure>

      <figure class="tile forest">
        <figcaption>Forest</figcaption>
      </figure>

      <figure class="tile city">
        <figcaption>City</figcaption>
      </figure>

      <figure class="tile desert">
        <figcaption>Desert</figcaption>
      </figure>

      <figure class="tile snow">
        <figcaption>Snow</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
